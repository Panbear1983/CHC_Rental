[project]
name = "chc-rental"
version = "0.1.0"
description = "CHC Rental — file-based multi-source rental notifier with owner TUI and deterministic matching"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "textual>=8,<9",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
chc-rental-tui = "chc_rental.tui.app:run"
chc-rental = "chc_rental.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chc_rental = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
